name: Desktop release

# Tag a release to build + publish the desktop apps:
#   git tag v0.2.0 && git push --tags
# Produces installers for Windows / macOS / Linux and publishes them, with the
# latest*.yml update metadata, to a GitHub Release. Installed apps auto-update
# from the newest (non-prerelease) release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to build (e.g. 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder: --win
          - os: macos-latest
            builder: --mac
          - os: ubuntu-latest
            builder: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve version
        id: v
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run build:shared

      - name: Set desktop version
        shell: bash
        run: |
          cd apps/desktop
          npm version "${{ steps.v.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build installer
        shell: bash
        env:
          AI_ARCADE_API_URL: ${{ vars.PUBLIC_API_URL }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          cd apps/desktop
          npx electron-vite build
          npx electron-builder ${{ matrix.builder }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: warn

  # One job publishes everything, so the three platform builds don't race to
  # create the same release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
